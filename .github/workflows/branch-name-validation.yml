name: Branch Name Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Validating branch: ${HEAD_REF}"

          if [[ "${HEAD_REF}" =~ ^feature\/[0-9]{8,}-[a-z0-9-]+$ ]]; then
            exit 0
          fi

          if [[ "${HEAD_REF}" =~ ^bugfix\/[0-9]{8,}-[a-z0-9-]+$ ]]; then
            exit 0
          fi

          if [[ "${HEAD_REF}" =~ ^release\/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi

          if [[ "${HEAD_REF}" =~ ^hotfix\/[0-9]{8,}-[a-z0-9-]+$ ]]; then
            exit 0
          fi

          echo "Invalid branch name: ${HEAD_REF}"
          echo "Allowed patterns:"
          echo "  feature/20260517-my-change"
          echo "  bugfix/20260517-fix-issue"
          echo "  release/v1.2.0"
          echo "  hotfix/20260517-critical-fix"
          exit 1
